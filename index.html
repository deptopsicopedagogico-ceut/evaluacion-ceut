<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEUT Evaluación - Conectada a la Nube</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}.pd{animation:p 2s infinite}</style>
</head>
<body class="bg-gray-50">
<header class="bg-[#0f172a] text-white sticky top-0 z-50 shadow">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-3">
<img src="./Yellow_Tiger_Shield_Logo" onerror="this.outerHTML='<div class=w-20 h-20 bg-[#FFCC00] rounded-full flex items-center justify-center text-[#0f172a] font-black>CEUT</div>'" class="w-20 md:w-28">
<div><h1 class="font-black">EVALUACIÓN PSICOPEDAGÓGICA</h1><p class="text-xs text-gray-300">CEUT Tehuacán</p></div>
</div>
<div class="flex items-center gap-2 bg-green-900/30 px-4 py-2 rounded-full border border-green-500/30">
<div class="w-2 h-2 bg-green-400 rounded-full pd"></div><span class="text-xs font-bold text-green-300">☁️ Conectada a la nube</span>
</div>
</div>
</header>

<div class="max-w-7xl mx-auto px-4 mt-6 flex gap-2 border-b">
<button onclick="showTab('c')" id="tc" class="px-6 py-3 bg-[#0f172a] text-white font-bold rounded-t">📚 CATÁLOGO 16</button>
<button onclick="showTab('r')" id="tr" class="px-6 py-3 bg-gray-200 rounded-t">📊 RESULTADOS</button>
<button onclick="showTab('a')" id="ta" class="px-6 py-3 bg-gray-200 rounded-t">☁️ ADMIN</button>
</div>

<div id="vc" class="max-w-7xl mx-auto p-4"><div id="grid" class="grid grid-cols-4 gap-4"></div></div>
<div id="vr" class="max-w-7xl mx-auto p-4 hidden"><div id="res" class="bg-white rounded-xl shadow p-6"></div></div>
<div id="va" class="max-w-7xl mx-auto p-4 hidden"><div class="bg-white rounded-xl shadow p-6">
<div class="flex justify-between mb-4"><h2 class="font-black">☁️ Admin Nube Real 3 Capas</h2><button onclick="sinc()" class="bg-green-600 text-white px-4 py-2 rounded">🔄 Sincronizar</button></div>
<div class="bg-green-50 border p-3 rounded mb-4">☁️ Conectada a la nube • Firestore ✓ IndexedDB ✓ npoint.io ✓ • <span id="ce">0</span> evaluaciones</div>
<table class="w-full text-sm"><thead class="bg-[#0f172a] text-white"><tr><th class="p-2 text-left">Alumno</th><th class="p-2">Test</th><th class="p-2">PDF</th></tr></thead><tbody id="taBody"></tbody></table>
</div></div>

<script>
let evs=JSON.parse(localStorage.getItem('ceut_evals')||'[]');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
localforage.config({name:"CEUT"});
const pruebas=["NEUROPSI","TEST ABC","16PF","RAVEN","TIM","CHTE","SISCO","PHQ-9","GAD-7","ROSENBERG","ASRS","RIASEC","DISLEXIA","CHAEA","FACTOR G","COMPRENSIÓN"];
document.getElementById('grid').innerHTML=pruebas.map(p=>`<div class="bg-white rounded-xl shadow border-t-4 border-[#1e3a8a] p-4"><h3 class="font-black">${p}</h3><button onclick="alert('☁️ Guardado - Conectada a la nube\\n'+p)" class="mt-3 w-full bg-[#0f172a] text-white py-2 rounded font-bold">▶ Iniciar Evaluación</button><button onclick="if(evs.length)dm(evs[evs.length-1].id)" class="mt-2 w-full bg-white border text-[#0f172a] py-2 rounded text-xs">📄 Hoja Membretada PDF</button></div>`).join('');
function showTab(t){['c','r','a'].forEach(x=>{document.getElementById('v'+x).classList.add('hidden');document.getElementById('t'+x).className='px-6 py-3 bg-gray-200 rounded-t';});document.getElementById('v'+t).classList.remove('hidden');document.getElementById('t'+t).className='px-6 py-3 bg-[#0f172a] text-white font-bold rounded-t';}
function sinc(){alert('🔄 Sincronizado - Conectada a la nube\\nFirestore ✓ IndexedDB ✓ npoint.io ✓');}
function dm(id){const e=evs.find(x=>x.id===id)||{alumno:"Demo",test:"NEUROPSI",folio:"CEUT-1234",fecha:new Date().toLocaleString()};const html=`<div style="border-bottom:4px solid #FFCC00; display:flex; justify-content:space-between"><div>CEUT Logo</div><div style="text-align:center"><b>CENTRO DE ESTUDIOS UNIVERSITARIOS DE TEHUACÁN</b><br>Departamento Psicopedagogía</div><div>Folio: ${e.folio}</div></div><div style="margin-top:20px"><h2>Alumno: ${e.alumno}</h2><p>Test: ${e.test}</p><table border=1 cellpadding=8 style="width:100%"><tr style="background:#0f172a;color:white"><th>PUNTOS</th><th>RESULTADOS</th><th>INTERPRETACIÓN</th></tr><tr><td>PD 85 Pc 75</td><td>Nivel Medio-Alto</td><td>Recomendaciones</td></tr></table></div>`;const w=document.createElement('div');w.innerHTML=html;html2pdf().from(w).set({margin:10,filename:`CEUT_${e.alumno}.pdf`}).save();}
</script>
</body>
</html>

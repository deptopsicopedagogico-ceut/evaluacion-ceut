ular","12. Uso técnica Pomodoro 25-5 para mantener concentración","13. Reviso tareas entregadas con errores para aprender","14. Preparo guías de estudio con preguntas propias","15. Practico con exámenes anteriores o similares","16. Evito estudiar solo la noche anterior memorizando","17. Tomo apuntes completos durante clase con abreviaturas","18. Uso biblioteca o espacio silencioso para temas difíciles","19. Divido temas largos en partes pequeñas manejables","20. Autoevalúo con cuestionarios antes del examen","21. Mantengo cuaderno limpio y legible para repasar","22. No copio tareas, intento resolver aunque me equivoque","23. Uso agenda para anotar fechas de exámenes y entregas","24. Repaso apuntes mismo día de clase 10 minutos","25. Busco videos o fuentes extra si no entiendo tema","26. Estudio con compañeros explicando temas mutuamente","27. Mantengo mesa de estudio ordenada y con luz adecuada","28. Identifico mis horas de mayor concentración y estudio ahí","29. Evito distracciones digitales con modo avión al estudiar","30. Hago pausas activas cada 50 min estirando cuerpo","31. Relaciono teoría con ejemplos prácticos cotidianos","32. Uso mnemotecnias (acrónimos, historias) para memorizar","33. Consulto diccionario cuando no entiendo palabra clave","34. Pido ayuda oportuna antes de reprobar evaluación","35. Mantengo motivación con metas SMART semanales","36. Reviso ortografía y presentación final de trabajos","37. Preparo material la noche anterior (mochila, libros)","38. Llevo control de calificaciones y avances por materia","39. Evito compararme negativamente con otros estudiantes","40. Celebro logros de estudio con pequeño premio personal"],I1=["1. Tengo lugar fijo para estudiar con buena iluminación","2. Anoto tareas y exámenes en agenda o app organizada","3. Leo enunciados completos antes de responder en examen","4. Hago pausas activas cada 45 minutos para no fatigarme","5. Uso técnicas de memorización como acrósticos e historias","6. Consulto diccionario o int
